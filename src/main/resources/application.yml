# Configuración común a todos los perfiles.
# NUNCA se ponen credenciales aquí: todo valor sensible viene por variables de
# entorno (ver .env.example). El perfil activo por defecto es "dev".
spring:
  application:
    name: una-joven-evangelizando
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Datasource PostgreSQL (Supabase). La URL debe incluir sslmode=require.
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    # El dialecto lo detecta Hibernate automáticamente desde la conexión
    # (PostgreSQL en dev/prod, H2 en pruebas): no se fija de forma explícita.

server:
  # Railway inyecta PORT; en local usa 8080 por defecto.
  port: ${PORT:8080}

# Usuario administrador inicial (sembrado idempotente, ver DataSeeder).
# La contraseña se guarda hasheada con BCrypt; si no se define, no se siembra
# ningún usuario admin (nunca hay una contraseña por defecto en el código).
app:
  admin:
    initial-username: ${ADMIN_INITIAL_USERNAME:maria}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}

# Integración con YouTube Data API v3.
youtube:
  api:
    # La llave se inyecta por variable de entorno; sin valor por defecto.
    key: ${YOUTUBE_API_KEY:}
  channel:
    # Canal de Una Joven Evangelizando.
    id: ${YOUTUBE_CHANNEL_ID:UC1D51aQt7mQQ8avzILW51zQ}
