<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Fila reutilizable de 4 iconos sociales (hero y footer). Los SVG son verbatim
     del diseño; las URLs vienen de configuración (${social.*}). Decisión H:
     incluye Facebook. -->
<div th:fragment="socialIcons" style="display:flex;gap:12px;justify-content:center;">
    <a th:href="${social.youtube}" aria-label="YouTube" target="_blank" rel="noopener"
       style="display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:999px;background:var(--c-marron);box-shadow:0 6px 16px rgba(107,68,35,0.3);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6z"/></svg>
    </a>
    <a th:href="${social.instagram}" aria-label="Instagram" target="_blank" rel="noopener"
       style="display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:999px;background:var(--c-marron);box-shadow:0 6px 16px rgba(107,68,35,0.3);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.6" cy="6.4" r="1.3" fill="#fff" stroke="none"/></svg>
    </a>
    <a th:href="${social.tiktok}" aria-label="TikTok" target="_blank" rel="noopener"
       style="display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:999px;background:var(--c-marron);box-shadow:0 6px 16px rgba(107,68,35,0.3);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M16.5 2h-3v13.2a2.4 2.4 0 1 1-2-2.36V9.7a5.6 5.6 0 1 0 5 5.56V8.9a6.6 6.6 0 0 0 3.9 1.27V7.1a3.7 3.7 0 0 1-3.9-3.5V2z"/></svg>
    </a>
    <a th:href="${social.facebook}" aria-label="Facebook" target="_blank" rel="noopener"
       style="display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:999px;background:var(--c-marron);box-shadow:0 6px 16px rgba(107,68,35,0.3);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M14 8.5V6.8c0-.8.2-1.3 1.4-1.3H17V2.6c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2H8.3v3.1H10.8V22H14v-8.4h2.4l.4-3.1H14z"/></svg>
    </a>
</div>
</body>
</html>
