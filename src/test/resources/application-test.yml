# Perfil de pruebas: base de datos H2 en memoria (modo PostgreSQL).
# Aísla las pruebas de Supabase; no requiere secretos ni red.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# Valores de prueba para la integración con YouTube (no se llama a la API real).
youtube:
  api:
    key: test-key
  channel:
    id: UC-test-channel

# En pruebas no se refresca la caché al arranque (evita llamadas de red reales).
app:
  cache:
    refresh-on-startup: false
