# Configuración de build para Railway (Nixpacks).
# Compila el JAR ejecutable con el Maven Wrapper (JDK 17) y lo arranca.
# Las pruebas se omiten aquí (la CI de GitHub Actions es la que las corre);
# el JAR se ejecuta con el perfil que definas en las variables del servicio
# (SPRING_PROFILES_ACTIVE=prod) y en el puerto que Railway inyecta (PORT).

[phases.setup]
nixPkgs = ["jdk17", "maven"]

[phases.build]
cmds = ["./mvnw -B -ntp clean package -DskipTests"]

[start]
cmd = "java -jar target/una-joven-evangelizando.jar"
